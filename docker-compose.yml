services:
  backend-python:
    build:
      context: ./backend-python
      network: host
    container_name: trading-backend
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis-trading
      - POSTGRES_HOST=postgres-trading
      - SQLITE_DATA_DIR=/app/data
      # A2: perfil microcapital en demo (docs/analisis-bot/05 §9). Se puede
      # cambiar en el .env raíz sin tocar este archivo; BALANCE_CAP_USDT=0 lo apaga.
      - BALANCE_CAP_USDT=${BALANCE_CAP_USDT:-100}
      - MAX_CONCURRENT_GRIDS=${MAX_CONCURRENT_GRIDS:-2}
      - MAX_RISK_PCT=${MAX_RISK_PCT:-0.25}
      - MIN_NOTIONAL_FROM_MAINNET=${MIN_NOTIONAL_FROM_MAINNET:-true}
    ports:
      - "8043:8000"
    volumes:
      - ./backend-data:/app/data
    depends_on:
      - redis-trading
      - postgres-trading
    networks:
      - default
      - infra_shared
    restart: unless-stopped

  redis-trading:
    image: redis:7-alpine
    container_name: redis-trading
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./redis-trading-data:/data
    networks:
      - default
    restart: unless-stopped

  postgres-trading:
    image: postgres:15
    container_name: postgres-trading
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "9043:5432"
    volumes:
      - ./postgres-trading-data:/var/lib/postgresql/data
    networks:
      - default
    restart: unless-stopped

networks:
  default:
  infra_shared:
    external: true
